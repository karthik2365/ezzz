<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Meet Karthik, an undergraduate student at Anurag University interested in machine learning and systems.">
  <title>About — karthik2365</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --paper:#050505; --ink:#f5f5f5; --muted:#a1a1a1; --line:#303030; --width:1120px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .wrap { width:min(var(--width),calc(100% - 64px)); margin-inline:auto; }
    .topbar { height:84px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:15px; }
    .wordmark { font-size:20px; font-weight:650; letter-spacing:-.03em; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:7px; }
    .nav { display:flex; gap:18px; }
    .nav a { text-decoration:underline; text-underline-offset:6px; }
    .eyebrow,.section-label,.index { color:var(--muted); font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:12px; letter-spacing:.08em; }
    .eyebrow { margin:0 0 26px; }
    main { flex:1; }
    h1 { margin:0 0 55px; font-size:clamp(44px,6vw,76px); font-weight:500; letter-spacing:-.06em; line-height:1.08; }
    .about { padding:80px 0 90px; display:grid; grid-template-columns:1fr 2fr; gap:50px; }
    .section-label { margin:7px 0 0; }
    .about-copy { max-width:740px; }
    .about-copy p { margin:0 0 24px; color:#dedede; font-size:16px; line-height:1.9; }
    .about-copy strong { color:var(--ink); font-weight:700; }
    .focus { padding:0 0 96px; }
    .focus-heading { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:34px; }
    h2 { margin:0; font-size:clamp(30px,4vw,44px); font-weight:500; letter-spacing:-.055em; }
    .focus-list { border-top:1px solid var(--line); }
    .focus-item { display:grid; grid-template-columns:70px 1fr 1fr; gap:25px; align-items:start; padding:26px 0 29px; border-bottom:1px solid var(--line); }
    .index { padding-top:5px; }
    .focus-item h3 { margin:0; font-size:19px; font-weight:500; letter-spacing:-.035em; }
    .focus-item p { max-width:400px; margin:0; color:var(--muted); font-size:13px; line-height:1.8; }
    footer { min-height:74px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:11px; }
    footer a { text-decoration:none; }
    @media(max-width:680px) {
      .wrap { width:min(100% - 40px,var(--width)); }
      .topbar { height:68px; }
      .nav { gap:16px; font-size:12px; }
      .about { padding:60px 0 65px; grid-template-columns:1fr; gap:25px; }
      .about-copy p { font-size:15px; }
      .focus { padding-bottom:70px; }
      .focus-item { grid-template-columns:38px 1fr; gap:12px 16px; }
      .focus-item p { grid-column:2; }
      footer { flex-wrap:wrap; gap:15px; }
    }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <header class="wrap topbar">
    <a class="wordmark" href="https://github.com/karthik2365" aria-label="karthik2365 on GitHub">karthik2365 ↗</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
      <a href="projects.html">Projects</a>
      <a href="about.html" aria-current="page">About</a>
    </nav>
  </header>
  <main>
    <section class="wrap about">
      <div class="about-copy">
        <p>Hey, I’m <strong>Karthik</strong>, an undergraduate student graduating from <strong>Anurag University</strong>.</p>
      </div>
    </section>
  </main>
  <footer class="wrap"><a href="index.html">← Home</a><span>Machine learning, from the inside.</span><span>Portfolio views: <span id="portfolio-views">—</span></span><span>© <span id="year">2026</span></span></footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const viewCount = document.getElementById('portfolio-views');
    if (location.protocol === 'https:' && location.hostname.endsWith('github.io')) {
      fetch('https://counterapi.com/api/karthik2365.github.io/view/ezzz-portfolio')
        .then(response => response.ok ? response.json() : Promise.reject())
        .then(data => { viewCount.textContent = new Intl.NumberFormat().format(data.value); })
        .catch(() => { viewCount.textContent = '—'; });
    }
  </script>
</body>
</html>
