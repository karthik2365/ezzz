<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Notes and writing by Karthik on machine learning, systems, and technology.">
  <title>Blog — karthik2365</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:dark; --paper:#050505; --ink:#f5f5f5; --muted:#a1a1a1; --line:#303030; --width:1120px; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:flex; flex-direction:column; background:var(--paper); color:var(--ink); font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    .wrap { width:min(var(--width),calc(100% - 64px)); margin-inline:auto; }
    .topbar { height:84px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:15px; }
    .wordmark { font-size:20px; font-weight:600; letter-spacing:-.03em; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:7px; }
    .nav { display:flex; gap:18px; }
    .nav a { text-decoration:underline; text-underline-offset:6px; }
    main { flex:1; padding-top:86px; }
    .eyebrow { margin:0 0 26px; color:var(--muted); font-size:12px; letter-spacing:.08em; }
    h1 { margin:0; font-size:clamp(44px,6vw,76px); font-weight:500; letter-spacing:-.06em; line-height:1.08; }
    .empty { margin-top:75px; padding:26px 0; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
    footer { min-height:74px; display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-size:11px; }
    footer a { text-decoration:none; }
    @media(max-width:680px) {
      .wrap { width:min(100% - 40px,var(--width)); }
      .topbar { height:68px; }
      .nav { gap:10px; font-size:10px; }
      main { padding-top:65px; }
      footer { flex-wrap:wrap; gap:15px; }
    }
  </style>
</head>
<body>
  <header class="wrap topbar">
    <a class="wordmark" href="https://github.com/karthik2365" aria-label="karthik2365 on GitHub">karthik2365 ↗</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="blog.html" aria-current="page">Blog</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
    </nav>
  </header>
  <main class="wrap">
    <p class="eyebrow">Notes / writing</p>
    <h1>Blog.</h1>
    <p class="empty">No posts yet.</p>
  </main>
  <footer class="wrap"><a href="index.html">← Home</a><span>Machine learning, from the inside.</span><span id="portfolio-views">—</span><span>© <span id="year">2026</span></span></footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const viewCount = document.getElementById('portfolio-views');
    if (location.protocol === 'https:' && location.hostname.endsWith('github.io')) {
      fetch('https://counterapi.com/api/karthik2365.github.io/view/ezzz-portfolio')
        .then(response => response.ok ? response.json() : Promise.reject())
        .then(data => { viewCount.textContent = new Intl.NumberFormat().format(data.value); })
        .catch(() => { viewCount.textContent = '—'; });
    }
  </script>
</body>
</html>
